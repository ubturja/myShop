services:
  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: myshop-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: myshop
      MYSQL_USER: myshop
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - myshop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache and queue
  redis:
    image: redis:7-alpine
    container_name: myshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - myshop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel backend
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: myshop-backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=myshop
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - myshop-network
    command: >
      sh -c "
        composer install --no-interaction --prefer-dist --no-scripts &&
        if [ ! -f .env ]; then cp .env.example .env; fi &&
        php artisan key:generate --ansi --force &&
        php artisan config:cache &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # Web3 microservice (Node.js)
  web3-service:
    build:
      context: ./web3-service
      dockerfile: ../docker/Dockerfile.web3
    container_name: myshop-web3
    working_dir: /app
    volumes:
      - ./web3-service:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-https://rpc-mumbai.maticvigil.com}
      - PRIVATE_KEY=${WEB3_SERVICE_PRIVATE_KEY:-}
      - WEB3_MOCK=${WEB3_MOCK:-true}
    networks:
      - myshop-network
    command: npm run dev

  # React frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: myshop-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WEB3_SERVICE_URL=http://localhost:3001
    networks:
      - myshop-network
    command: npm run dev
    depends_on:
      - backend

networks:
  myshop-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backend_vendor:
